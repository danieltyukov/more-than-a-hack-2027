name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-possession.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests
      # the organisers' scorer must still run on a fresh clone with no data
      - run: python evaluation/run_evaluation.py
